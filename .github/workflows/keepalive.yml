name: Supabase keep-alive

# 無料Supabaseは約1週間アクセスが無いと自動停止するため、
# 数日に1回だけ軽くアクセスして「使用中」の状態を保ち、停止を防ぐ。
on:
  schedule:
    - cron: '17 3 */3 * *' # 3日ごと（UTC）
  workflow_dispatch: {} # 手動でも実行可能

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST (keep project awake)
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            "https://hfxxanabyquogrupjxer.supabase.co/rest/v1/worlds?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}")
          echo "Supabase responded with HTTP $code"
          # 200/206 なら成功。停止直後などは失敗しても次回に回復する。
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
